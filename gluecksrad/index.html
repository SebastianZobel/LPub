<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#032761">
<title>o2 Team-Glücksrad</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}body{color:#fff;background:radial-gradient(circle at 15% 12%,#00d7ff35,transparent 26%),radial-gradient(circle at 85% 14%,#685aff40,transparent 28%),linear-gradient(145deg,#061a3a,#032761 55%,#041d49);min-height:100vh}.page{min-height:100vh;display:grid;place-items:center;padding:22px}.shell{width:min(1050px,100%);display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:center}.card{background:linear-gradient(145deg,#ffffff20,#ffffff0c);border:1px solid #ffffff2d;box-shadow:0 30px 80px #0006;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:30px}.main{padding:24px}.head{display:flex;align-items:center;gap:14px}.logo{font-size:43px;font-weight:300;letter-spacing:-4px}.logo sub{font-size:.43em;position:relative;bottom:-.12em}.head h1{margin:0;font-size:clamp(24px,3vw,36px);letter-spacing:-1px}.head p{margin:4px 0 0;color:#ffffffa8;font-size:13px}.stage{min-height:575px;display:grid;place-items:center;position:relative}.halo{position:absolute;width:min(550px,86vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#00d7ff31,transparent 68%);filter:blur(8px)}.pointer{position:absolute;top:28px;z-index:5;width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid #fff;filter:drop-shadow(0 8px 10px #0008);transform-origin:50% 0}.frame{position:relative;width:min(530px,84vw);aspect-ratio:1;border-radius:50%;padding:11px;background:linear-gradient(145deg,#fff,#bfe8ff88 35%,#ffffff40);box-shadow:0 30px 60px #0007,0 0 42px #0099ff35;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.wheel{position:relative;width:100%;height:100%;border-radius:50%;background:conic-gradient(from -20deg,#ff4d5d 0 40deg,#ff8b3d 40deg 80deg,#ffd43b 80deg 120deg,#69d36f 120deg 160deg,#19c7b7 160deg 200deg,#2f8cff 200deg 240deg,#5c60e8 240deg 280deg,#9d57dc 280deg 320deg,#e952b5 320deg 360deg);overflow:hidden;box-shadow:inset 0 0 38px #0004;will-change:transform}.wheel:after{content:"";position:absolute;inset:20%;border-radius:50%;border:2px solid #ffffff55;background:#ffffff10;pointer-events:none}.label{position:absolute;width:clamp(74px,20vw,116px);height:30px;margin:0;font-weight:800;font-size:clamp(11px,2.5vw,16px);line-height:1;text-shadow:0 1px 5px #00194a99;display:grid;place-items:center;white-space:nowrap;pointer-events:none;z-index:2;transform-origin:center}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:103px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#dcefff 40%,#70c4ff);border:6px solid #ffffffc0;color:#06306e;font-weight:800;font-size:18px;box-shadow:0 10px 25px #0005}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.controls button{border:0;border-radius:15px;padding:13px 19px;font:inherit;cursor:pointer}.controls button:disabled{opacity:.5;cursor:default}.spin{min-width:180px;background:linear-gradient(135deg,#fff,#bff7ff 50%,#68e7ff);color:#02245a;font-weight:800;box-shadow:0 12px 28px #00d7ff3b}.subbtn{color:#fff;background:#ffffff12;border:1px solid #ffffff24!important}.hint{text-align:center;color:#ffffff8d;font-size:12px;margin-top:11px}.side{padding:22px;min-height:335px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:#9eeeff}.winner{font-size:clamp(34px,4vw,50px);margin:35px 0 10px;letter-spacing:-1.5px;transform-origin:left center}.winner.reveal{animation:winnerIn .68s cubic-bezier(.16,1,.3,1) both,winnerPulse .72s .74s ease-in-out 3}.status{color:#ffffffac;font-size:14px;line-height:1.5}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}.chip{font-size:11px;padding:5px 8px;border-radius:999px;background:#ffffff0d;border:1px solid #ffffff1f}.note{margin-top:22px;padding-top:14px;border-top:1px solid #ffffff16;color:#ffffff67;font-size:10px;line-height:1.45}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.piece{position:absolute;top:-15px;width:8px;height:13px;border-radius:2px;animation:fall var(--d) ease-out forwards}@keyframes winnerIn{0%{opacity:0;transform:translate3d(70px,18px,0) scale(.78);filter:blur(8px)}65%{opacity:1;filter:blur(0);transform:translate3d(-5px,-2px,0) scale(1.06)}100%{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}@keyframes winnerPulse{0%,100%{transform:scale(1);text-shadow:0 0 0 #79e9ff00}50%{transform:scale(1.085);text-shadow:0 0 24px #79e9ff88}}@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.15}}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{min-height:auto}}@media(max-width:560px){.page{padding:12px}.main{padding:17px}.stage{min-height:455px}.pointer{top:18px}.side{padding:18px}.label{font-size:clamp(10px,3.1vw,13px);width:88px}}
</style>
</head>
<body>
<main class="page"><section class="shell"><div class="card main"><div class="head"><div class="logo">o<sub>2</sub></div><div><h1>Team-Glücksrad</h1><p>Ein Dreh. Ein Moment. Ein Name.</p></div></div><div class="stage"><div class="halo"></div><div class="pointer" id="ptr"></div><div class="frame" id="frame"><div class="wheel" id="wheel"></div><div class="hub">o₂</div></div></div><div class="controls"><button class="spin" id="spin">JETZT DREHEN</button><button class="subbtn" id="sound">🔊</button><button class="subbtn" id="reset">Zurücksetzen</button></div><div class="hint">Wische mit dem Finger über das Rad oder ziehe mit der Maus darüber.</div></div><aside class="card side"><div><div class="eyebrow">Auswahl</div><h2 class="winner" id="winner">Bereit?</h2><div class="status" id="status">Starte per Button oder Wischbewegung.</div><div class="chips" id="chips"></div></div><div class="note">Show-Modus: Die Auswahl ist für eine moderierte Präsentation gesteuert und kein fairer Zufallsgenerator.</div></aside></section></main><div class="confetti" id="confetti"></div>
<script>
const names=["Martin","Ulrike","Annabell","Tina","Birgit","Juliane","Nina","Susanne","Sebastian"];
const winnerNames=["Martin","Annabell","Birgit"];
const winnerIndexes=winnerNames.map(n=>names.indexOf(n));
const cols=["#ff4d5d","#ff8b3d","#ffd43b","#69d36f","#19c7b7","#2f8cff","#5c60e8","#9d57dc","#e952b5"];
const wheel=document.querySelector("#wheel"),frame=document.querySelector("#frame"),ptr=document.querySelector("#ptr"),winner=document.querySelector("#winner"),status=document.querySelector("#status"),spinBtn=document.querySelector("#spin"),resetBtn=document.querySelector("#reset"),soundBtn=document.querySelector("#sound"),chips=document.querySelector("#chips"),confetti=document.querySelector("#confetti"),SEG=360/names.length;
let rot=0,busy=false,sound=true,ctx,lastSector=null,drag=false,lx=0,ly=0,dist=0;
names.forEach((n,i)=>{const angle=i*SEG;const rad=angle*Math.PI/180;const x=50+38.5*Math.sin(rad);const y=50-38.5*Math.cos(rad);const readable=(angle>90&&angle<270)?angle+180:angle;const d=document.createElement("div");d.className="label";d.style.left=x+"%";d.style.top=y+"%";d.style.transform=`translate(-50%,-50%) rotate(${readable}deg)`;d.textContent=n;wheel.appendChild(d);const c=document.createElement("span");c.className="chip";c.textContent=n;c.style.boxShadow=`inset 0 0 0 1px ${cols[i]}66`;chips.appendChild(c)});
const mod=(n,m)=>((n%m)+m)%m;
const centerRotation=i=>mod(-(i*SEG),360);
const indexAtPointer=r=>Math.floor(mod(-r+SEG/2,360)/SEG)%names.length;
function audio(){if(!ctx)ctx=new(AudioContext||webkitAudioContext)();if(ctx.state==="suspended")ctx.resume()}
function tick(v=.05,f=900){if(!sound)return;audio();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type="triangle";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(280,t+.04);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.055)}
function fanfare(){if(!sound)return;audio();[523,659,784,1047].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.08;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.1,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.23)})}
function animate(to,dur){return new Promise(done=>{let from=rot,start=performance.now(),prev=from;function f(now){let t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,5),r=from+(to-from)*e;if(t>.88){let q=(t-.88)/.12;r+=Math.sin(q*Math.PI*3)*(1-q)*.45}wheel.style.transform=`rotate(${r}deg)`;let s=Math.floor(mod(r+SEG/2,360)/SEG);if(lastSector===null)lastSector=s;if(s!==lastSector){tick(Math.max(.025,Math.min(.08,.025+Math.abs(r-prev)*.007)),850+Math.random()*160);ptr.style.transform="rotate(3deg)";setTimeout(()=>ptr.style.transform="",38);lastSector=s}prev=r;if(t<1)requestAnimationFrame(f);else{rot=to;wheel.style.transform=`rotate(${rot}deg)`;done()}}requestAnimationFrame(f)})}
function party(){confetti.innerHTML="";for(let i=0;i<50;i++){let p=document.createElement("i");p.className="piece";p.style.left=Math.random()*100+"%";p.style.background=cols[Math.floor(Math.random()*cols.length)];p.style.setProperty("--x",(Math.random()-.5)*280+"px");p.style.setProperty("--r",360+Math.random()*900+"deg");p.style.setProperty("--d",2.2+Math.random()*1.6+"s");confetti.appendChild(p)}setTimeout(()=>confetti.innerHTML="",4000)}
function revealWinner(name){winner.classList.remove("reveal");winner.textContent=name;void winner.offsetWidth;winner.classList.add("reveal")}
async function spin(){if(busy)return;busy=true;spinBtn.disabled=resetBtn.disabled=true;audio();winner.classList.remove("reveal");winner.textContent="…";status.textContent="Das Rad nimmt Fahrt auf.";lastSector=null;const chosenIndex=winnerIndexes[Math.floor(Math.random()*winnerIndexes.length)];const chosen=names[chosenIndex];const inside=9+Math.random()*3;const targetMod=mod(centerRotation(chosenIndex)-SEG/2+inside,360);const base=rot+(7+Math.floor(Math.random()*2))*360;let to=base+mod(targetMod-mod(base,360),360);if(indexAtPointer(to)!==chosenIndex){const safeMod=centerRotation(chosenIndex);to=base+mod(safeMod-mod(base,360),360)}await animate(to,5200+Math.random()*450);revealWinner(chosen);status.textContent=`Gewählt wurde ${chosen}.`;fanfare();party();spinBtn.disabled=resetBtn.disabled=false;busy=false}
function reset(){if(busy)return;rot=0;wheel.style.transform="rotate(0deg)";winner.classList.remove("reveal");winner.textContent="Bereit?";status.textContent="Starte per Button oder Wischbewegung.";confetti.innerHTML=""}
spinBtn.onclick=spin;resetBtn.onclick=reset;soundBtn.onclick=()=>{sound=!sound;soundBtn.textContent=sound?"🔊":"🔇";if(sound){audio();tick()}};
frame.addEventListener("pointerdown",e=>{if(busy||e.pointerType==="mouse"&&e.button!==0)return;drag=true;lx=e.clientX;ly=e.clientY;dist=0;try{frame.setPointerCapture(e.pointerId)}catch{}e.preventDefault()},{passive:false});
frame.addEventListener("pointermove",e=>{if(!drag||busy)return;dist+=Math.hypot(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;e.preventDefault();if(dist>=22){drag=false;try{frame.releasePointerCapture(e.pointerId)}catch{}spin()}},{passive:false});
["pointerup","pointercancel"].forEach(x=>frame.addEventListener(x,e=>{drag=false;try{frame.releasePointerCapture(e.pointerId)}catch{}},{passive:false}));
</script>
</body></html>
